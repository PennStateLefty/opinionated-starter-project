name: "CD"

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # ── Stage 1: Deploy to Staging Slot ─────────────────────────────────────
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to staging slot
        run: |
          az webapp config container set \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
            --slot staging \
            --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/hello-world:${{ steps.tag.outputs.image_tag }}"

      - name: Wait for staging to be healthy
        run: |
          STAGING_URL="https://${{ secrets.APP_SERVICE_NAME }}-staging.azurewebsites.net/health"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}" || true)
            if [ "${STATUS}" = "200" ]; then
              echo "Staging slot is healthy"
              exit 0
            fi
            echo "Waiting for staging slot... (attempt ${i}/30)"
            sleep 10
          done
          echo "Staging slot did not become healthy"
          exit 1

      - name: Set app URL output
        id: app
        run: echo "url=https://${{ secrets.APP_SERVICE_NAME }}.azurewebsites.net" >> "$GITHUB_OUTPUT"

    outputs:
      app_url: ${{ steps.app.outputs.url }}

  # ── Stage 2: Swap to Production (Approval Gate) ────────────────────────
  swap-production:
    name: "Swap to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: ${{ needs.deploy-staging.outputs.app_url }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
            --slot staging \
            --target-slot production

      - name: Verify production health
        run: |
          PROD_URL="https://${{ secrets.APP_SERVICE_NAME }}.azurewebsites.net/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}")
          if [ "${STATUS}" != "200" ]; then
            echo "Production health check failed — consider rolling back"
            exit 1
          fi
          echo "Production is healthy"
