name: "CI"

on:
  pull_request:
    paths:
      - "src/hello-world/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  APP_DIR: src/hello-world
  PYTHON_VERSION: "3.12"

jobs:
  # ── Stage 1: Test ────────────────────────────────────────────────────────
  test:
    name: "Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/test_app.py -v --tb=short

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pytest tests/test_e2e.py -v --tb=short

  # ── Stage 2: Security Scan ──────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.APP_DIR }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v4
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high

  # ── Stage 3: Build & Push Container ─────────────────────────────────────
  build:
    name: "Build & Push"
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push container image
        working-directory: ${{ env.APP_DIR }}
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/hello-world"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker build -t "${SHA_TAG}" -t "${LATEST_TAG}" .
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

      - name: Output image tag
        id: image
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
